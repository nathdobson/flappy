[package]
name = "native-client"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = {path = "../../common/protocol",features = ["serde","uuid"]}
nusb = {path = "../../submodules/nusb",optional = true}
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "io-util", "fs", "io-std","time"] }
clap = { version = "4.6.0", features = ["derive"] }
itertools = "0.14.0"
serde = "1.0.228"
serde-json-core = {path="../../submodules/serde-json-core"}
jsonformat="2.1.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
btleplug = {path="../../submodules/btleplug",features = ["serde"], optional = true}
uuid = {path="../../submodules/uuid"}
serde-string = {path="../../common/serde-string"}
log = "0.4.29"
picoboot = {path="../../submodules/picoboot", optional = true }
setup-client = {path="../../common/setup-client",default-features = false,features = ["clap"]}
thiserror= "2.0.18"
error-report = {path="../../common/error-report"}
mqtt-client-tokio = {path="../../common/mqtt-client-tokio",optional = true}
heapless = {path="../../submodules/heapless",optional = true}
mqtt-core = {path="../../common/mqtt-core",optional = true}

[target.'cfg(darwin)'.dependencies]
objc2={version="0.6.1",features=["disable-encoding-assertions"]}

[features]
usb = ["dep:nusb","dep:picoboot","setup-client/usb"]
ble = ["dep:btleplug","setup-client/ble"]
mqtt = ["tokio/net","dep:mqtt-client-tokio","dep:heapless","dep:mqtt-core"]
default = ["ble","usb","mqtt"]