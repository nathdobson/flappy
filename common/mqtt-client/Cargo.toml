[package]
name = "mqtt-client"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-io-async = "0.6.1"
heapless = "0.9.2"
strum = {version="0.27.2",features=["derive"],default-features = false}
arena = {path="../arena"}
embassy-sync = "0.7.2"
webpki-roots = "1.0.4"
mqtt-core = {path="../mqtt-core"}

[dev-dependencies]
embassy-futures = "0.1.2"
tokio-rustls = "0.26.4"
tokio = {version="1.48.0",features=["macros","rt","net","io-util","time"]}
io-adapters = {path="../io-adapters"}