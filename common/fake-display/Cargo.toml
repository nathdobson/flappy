[package]
name = "fake-display"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
tokio = {version="1.48.0",features = ["macros","rt","rt-multi-thread","time","net","sync"]}
rustls = "0.23.35"
tokio-rustls = {version="0.26.4"}
webpki-roots = "1.0.4"
mqtt-client = {path="../mqtt-client"}
mqtt-core = {path="../mqtt-core"}
arena = {path="../arena"}
anyhow = "1.0.100"
io-adapters = {path="../io-adapters"}
embassy-futures = {path="../../submodules/embassy/embassy-futures"}
embassy-sync = {path="../../submodules/embassy/embassy-sync"}
serde-json-core = {path="../../submodules/serde-json-core"}
protocol = {path="../protocol", features = ["serde"]}
glyph-render = {path="../glyph-render"}
heapless = {path="../../submodules/heapless", features = ["alloc"]}