[package]
name = "setup-client-lib"
version = "0.1.0"
edition = "2024"

[dependencies]

btleplug = {path="../../submodules/btleplug-wasm",features = ["serde"],optional=true}

serde-string = {path="../serde-string",optional=true}
nusb = {path="../../submodules/nusb",optional = true,features = ["tokio"]}

protocol = {path="../protocol",features = ["uuid","serde"]}
futures-util = "0.3.32"
thiserror = "2.0.18"
heapless = {path="../../submodules/heapless"}
serde-json-core = "0.6.0"
tokio = {version = "1.51.1", features = ["io-util"]}
spawn-local = {path ="../spawn-local"}
clap = {version = "4.6.0",optional = true}
picoboot-cross = {path="../../submodules/picoboot-cross", optional = true }

[dev-dependencies]
tokio = {version="1.51.1",features = ["macros","rt"]}

[features]
default = ["ble","usb"]
ble = ["dep:btleplug","dep:serde-string"]
usb = ["dep:nusb","dep:picoboot-cross"]
clap = ["dep:clap"]
