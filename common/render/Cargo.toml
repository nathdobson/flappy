[package]
name = "render"
version = "0.1.0"
edition = "2024"

[dependencies]
unicode-segmentation = { version = "1.12.0", default-features = false ,optional=true}
unicode-normalization = {path="../../submodules/unicode-normalization", default-features = false,optional = true}
unidecode = {path="../../submodules/rust-unidecode",default-features = false,optional = true}
heapless = "0.9.2"

[features]
default = ["unicode"]
unicode = ["dep:unicode-segmentation","dep:unicode-normalization","dep:unidecode"]