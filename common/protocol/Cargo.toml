[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless = {version="0.9.2",features = ["serde"],default-features = false}
serde = { version = "1.0.228", features = ["derive"] ,default-features = false,optional = true}
mqtt-core = {path="../mqtt-core"}
sha2={version="0.10.9",default-features = false}
uuid = {version="1.23.0",optional = true}

[dev-dependencies]
serde-json-core = {path="../../submodules/serde-json-core"}

[features]
serde = ["dep:serde","mqtt-core/serde"]
uuid = ["dep:uuid"]