[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless = {path="../../submodules/heapless",features = ["serde"],default-features = false}
serde = { version = "1.0.228", features = ["derive"] ,default-features = false,optional = true}
mqtt-core = {path="../mqtt-core"}
sha2={version="0.10.9",default-features = false}
uuid = {version="1.23.0",optional = true}
embedded-tls = {path="../../submodules/embedded-tls", optional = true,default-features = false}
embassy-net = {path="../../submodules/embassy/embassy-net", optional = true,default-features = false}
mqtt-client = {path="../mqtt-client",optional = true,default-features = false}
embedded-io = {version = "0.7.1", optional = true,default-features = false}
protocol-wifi = {path="../protocol-wifi"}

[dev-dependencies]
serde-json-core = {path="../../submodules/serde-json-core"}

[features]
serde = ["dep:serde","mqtt-core/serde","protocol-wifi/serde"]
embedded-tls = ["dep:embedded-tls"]
embassy-net = ["dep:embassy-net"]
mqtt-client = ["dep:mqtt-client"]
embedded-io = ["dep:embedded-io"]
uuid = ["dep:uuid"]