[package]
name = "setup-client"
version = "0.1.0"
edition = "2024"

[dependencies]

btleplug = {path="../../submodules/btleplug",features = ["serde"],optional=true}

serde-string = {path="../serde-string",optional=true}
nusb = {path="../../submodules/nusb",optional = true,features = ["tokio"]}

protocol = {path="../protocol",features = ["uuid","serde"]}
futures-util = "0.3.32"
thiserror = "2.0.18"
heapless = {path="../../submodules/heapless"}
serde-json-core = {path="../../submodules/serde-json-core"}
tokio = {version = "1.51.1", features = ["io-util","sync"]}
spawn-local = {path ="../spawn-local"}
clap = {version = "4.6.0",optional = true}
picoboot = {path="../../submodules/picoboot", optional = true }
log = "0.4.29"
protocol-ble = {path="../protocol-ble",optional=true,features = ["uuid"]}

[dev-dependencies]
tokio = {version="1.51.1",features = ["macros","rt"]}

[features]
default = ["ble","usb"]
ble = ["dep:btleplug","dep:serde-string","dep:protocol-ble"]
usb = ["dep:nusb","dep:picoboot"]
clap = ["dep:clap"]
