[package]
edition = "2024"
name = "firmware"
version = "0.1.0"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "controller"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]

embassy-rp = { path = "../../submodules/embassy/embassy-rp", features = [
  "rp235xa",
  "time-driver",
   "critical-section-impl", "rp235xa","binary-info"
] }
embassy-time = { path = "../../submodules/embassy/embassy-time", features = [] }
embassy-usb = { path = "../../submodules/embassy/embassy-usb" ,optional = true}
embassy-net = { path = "../../submodules/embassy/embassy-net", features = [
  "tcp",
  "udp",
  "raw",
  "dhcpv4",
  "medium-ethernet",
  "dns",
  "proto-ipv4",
  "proto-ipv6",
], optional = true }
embassy-futures = { path = "../../submodules/embassy/embassy-futures" }
embassy-executor = { path = "../../submodules/embassy/embassy-executor", features = [
  "arch-cortex-m",
  "executor-thread",
  "executor-interrupt",
] }
embassy-sync = { path = "../../submodules/embassy/embassy-sync", features = [] }
trouble-host = { path = "../../submodules/trouble/host", optional = true }

critical-section = "1.1"
log = "0.4.28"
static_cell = { version = "2.1.1", features = [] }
serde = { version = "1.0.228", features = [
  "derive",
], default-features = false, optional = true }
serde-json-core = { path="../../submodules/serde-json-core", optional = true }
rand_core = "0.9.3"
uuid = { version = "1.18.1", default-features = false, optional = true }
heapless = { version = "0.9.2" }
embedded-tls = { path="../../submodules/embedded-tls", default-features = false, optional = true, features = ["webpki"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
smoltcp = { version = "0.12.0", default-features = false, optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
embedded-io = { version = "0.7.1", optional = true }
mqtt-client = { path = "../../common/mqtt-client", optional = true }
arena = { path = "../../common/arena", optional = true }
protocol = { path = "../../common/protocol" }
cyw43 = { path = "../../submodules/embassy/cyw43", features = [
  "log","firmware-logs"
], optional = true }
cyw43-pio = { path = "../../submodules/embassy/cyw43-pio", features = [
], optional = true }
glyph-render = {path ="../../common/glyph-render", default-features = false}
mqtt-core = {path="../../common/mqtt-core"}
crypto-verifier = {path="../../common/crypto-verifier",optional=true}
fixed = {version="1.29.0",optional=true}
spindle={path="../../spindle/spindle",optional = true}
mozilla-root-ca = {version="2025.6.7",features = ["pem"]}

[target.'cfg(target_arch="arm")'.dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = { version = "0.7.0", features = [] }


[build-dependencies]
built = { version = "0.8.0", features = ["git2"] }

[features]
default = ["radio", "flash", "serde", "display","unicode","setup","ble","wifi","mqtt","preemption","usb","spindle"]
serde = ["dep:serde", "heapless/serde", "dep:serde-json-core","protocol/serde"]
radio = [
  "dep:cyw43",
  "dep:cyw43-pio",
  "dep:embedded-io-async",
  "dep:embedded-io",
  "serde",
  "fixed",
]
flash = ["serde"]
display = []
unicode = ["glyph-render/unicode"]
setup = ["serde"]
ble = [
  "radio",
  "cyw43/bluetooth",
#  "cyw43-firmware/bluetooth",
  "dep:trouble-host",
  "dep:uuid",
  # There's a bug somewhere that corrupts BLE data without this
  "preemption"
]
wifi = ["radio","dep:smoltcp","embassy-net"]
mqtt = ["wifi",  "dep:embedded-tls",  "dep:mqtt-client",   "dep:arena",  "dep:crypto-verifier"]
preemption = []
usb = ["dep:embassy-usb"]
spindle = ["dep:spindle"]