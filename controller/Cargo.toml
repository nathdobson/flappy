[package]
name = "controller"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
arduino-core = { path = "../../arduino-rs/arduino-core" }
arduino-shift-output = { path = "../../arduino-rs/arduino-shift-output" }
arduino-stepper = { path = "../../arduino-rs/arduino-stepper" }
arduino-wifi = { path="../../arduino-rs/arduino-wifi"}
arrayvec = {version="0.7.6",default-features = false}
common  = {path ="../common"}
rand={version="0.9.2",default-features = false}
arduino-ble= {path="../../arduino-rs/arduino-ble"}
arduino-eeprom = {path = "../../arduino-rs/arduino-eeprom"}
serde={ version = "1.0.228", default-features = false, features = ["derive","alloc"] }
postcard={version="1.1.3",features=["alloc"]}