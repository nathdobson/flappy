[package]
name = "setup-client"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = {path = "../../common/protocol",features = ["serde","uuid"]}
nusb = {path = "../../submodules/nusb",optional = true}
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "io-util", "fs", "io-std","time"] }
clap = { version = "4.6.0", features = ["derive"] }
itertools = "0.14.0"
serde = "1.0.228"
serde-json-core = {path="../../submodules/serde-json-core"}
jsonformat="2.1.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
btleplug = {path="../../submodules/btleplug-wasm",features = ["serde"], optional = true}
uuid = "1.23.0"
serde-string = {path="../../common/serde-string"}
log = "0.4.29"
picoboot-cross = {path="../../submodules/picoboot-cross", optional = true }
setup-client-lib = {path="../../common/setup-client-lib",default-features = false,features = ["clap"]}
thiserror= "2.0.18"


[target.'cfg(darwin)'.dependencies]
objc2={version="0.6.1",features=["disable-encoding-assertions"]}

[features]
usb = ["dep:nusb","dep:picoboot-cross"]
ble = ["dep:btleplug","setup-client-lib/ble"]
default = ["ble","usb","setup-client-lib/usb"]