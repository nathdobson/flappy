[package]
name = "web-client"
version = "0.1.0"
authors = ["Nathan Dobson <nadobson@mac.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = {path = "../submodules/wasm-bindgen"}
mqtt-client = { path = "../common/mqtt-client" }
console_error_panic_hook = { version = "0.1.7" }
web-sys = { path="../submodules/wasm-bindgen/crates/web-sys", features = [
  "console",
  "Window",
  "Location",
  "UrlSearchParams",
  "HtmlBodyElement",
  "Document",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlDivElement",
  "CssStyleDeclaration",
  "HtmlTextAreaElement",
  "Text",
  "HtmlButtonElement",
  "HtmlAnchorElement",
  "HtmlUListElement",
  "HtmlLiElement",
  "HtmlLabelElement",
  "RequestDeviceOptions",
  "Bluetooth",
  "Navigator",
  "BluetoothLeScanFilterInit",
  "BluetoothDevice",
  "BluetoothRemoteGattServer",
  "BluetoothRemoteGattService",
  "BluetoothRemoteGattCharacteristic",
  "BlobPropertyBag",
  "Url",
  "FileSystemFileHandle",
  "File",
  "Request",
  "Response",
  "DomException",
  "Usb",
  "UsbDevice",
  "UsbDeviceRequestOptions",
  "UsbDeviceFilter",
  "UsbConfiguration",
  "UsbInterface",
  "UsbAlternateInterface",
  "UsbEndpoint",
  "UsbOutTransferResult",
  "UsbInTransferResult",
  "UsbTransferStatus",
  "HtmlOListElement",
] }
js-sys = {path="../submodules/wasm-bindgen/crates/js-sys"}
wasm-logger = "0.2.0"
log = "0.4.29"
wasm-bindgen-futures = "0.4.68"
url = "2.5.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_qs = "0.15.0"
ws_stream_wasm = { version = "0.7.5", features = ["tokio_io"] }
io-adapters = { path = "../common/io-adapters" }
embassy-futures = "0.1.2"
arena = { path = "../common/arena" }
protocol = { path = "../common/protocol", features = ["serde","uuid"] }
tokio = { version = "1.51.0", features = ["sync", "macros"] }
serde-json-core = "0.6.0"
heapless = "0.9.2"
mqtt-core = { path = "../common/mqtt-core" }
uuid = { version = "1.23.0", features = ["v4", "js"] }
futures-util = "0.3.31"
by_address = "1.2.1"
unicode-segmentation = "1.13.2"
jsonformat = "2.1.0"
itertools = "0.14.0"
empty-rc={path="../common/empty-rc"}
picoboot = {path="../submodules/picoboot"}
btleplug={path="../submodules/btleplug"}
nusb ={path="../submodules/nusb"}
setup-client-lib = {path="../common/setup-client-lib"}


[dev-dependencies]
wasm-bindgen-test = "0.3.68"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[patch.crates-io]
web-sys={path="../submodules/wasm-bindgen/crates/web-sys"}
wasm-bindgen={path="../submodules/wasm-bindgen"}
js-sys={path="../submodules/wasm-bindgen/crates/js-sys"}