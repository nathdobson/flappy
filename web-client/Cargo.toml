[package]
name = "web-client"
version = "0.1.0"
authors = ["Nathan Dobson <nadobson@mac.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = {path = "../submodules/wasm-bindgen"}
mqtt-client = { path = "../common/mqtt-client" }
console_error_panic_hook = { path="../submodules/console_error_panic_hook" }
web-sys = { path="../submodules/wasm-bindgen/crates/web-sys", features = [
  "console",
  "Window",
  "Location",
  "UrlSearchParams",
  "HtmlBodyElement",
  "Document",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlDivElement",
  "CssStyleDeclaration",
  "HtmlTextAreaElement",
  "Text",
  "HtmlButtonElement",
  "HtmlAnchorElement",
  "HtmlUListElement",
  "HtmlLiElement",
  "HtmlLabelElement",
  "RequestDeviceOptions",
  "Bluetooth",
  "Navigator",
  "BluetoothLeScanFilterInit",
  "BluetoothDevice",
  "BluetoothRemoteGattServer",
  "BluetoothRemoteGattService",
  "BluetoothRemoteGattCharacteristic",
  "BlobPropertyBag",
  "Url",
  "FileSystemFileHandle",
  "File",
  "Request",
  "Response",
  "DomException",
  "Usb",
  "UsbDevice",
  "UsbDeviceRequestOptions",
  "UsbDeviceFilter",
  "UsbConfiguration",
  "UsbInterface",
  "UsbAlternateInterface",
  "UsbEndpoint",
  "UsbOutTransferResult",
  "UsbInTransferResult",
  "UsbTransferStatus",
  "HtmlOListElement",
  "HtmlOptionElement",
  "HtmlSelectElement",
  "HtmlParagraphElement",
  "HtmlBrElement",
  "UserActivation",
] }
js-sys = {path="../submodules/wasm-bindgen/crates/js-sys"}
console_log = {path="../submodules/console_log"}
log = "0.4.29"
wasm-bindgen-futures = {path="../submodules/wasm-bindgen/crates/futures"}
url = "2.5.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_qs = "0.15.0"
ws_stream_wasm = { path="../submodules/ws_stream_wasm", features = ["tokio_io"] }
io-adapters = { path = "../common/io-adapters" }
embassy-futures = {path="../submodules/embassy/embassy-futures"}
protocol = { path = "../common/protocol", features = ["serde","uuid"] }
tokio = { version = "1.51.0", features = ["sync", "macros"] }
serde-json-core = {path="../submodules/serde-json-core"}
heapless = {path="../submodules/heapless",features = ["alloc"]}
mqtt-core = { path = "../common/mqtt-core" }
uuid = {  path="../submodules/uuid", features = ["v4", "js"] }
futures-util = "0.3.31"
unicode-segmentation = "1.13.2"
empty-rc={path="../common/empty-rc"}
picoboot = {path="../submodules/picoboot"}
btleplug={path="../submodules/btleplug"}
nusb ={path="../submodules/nusb"}
setup-client = {path="../common/setup-client"}
embassy-sync = {path="../submodules/embassy/embassy-sync"}
async_io_stream = "0.3.3"
protocol-wifi = {path="../common/protocol-wifi"}
error-report = {path="../common/error-report"}
thiserror="2.0.18"
regex = "1.12.3"

[build-dependencies]
built = {version="0.8.0",features = ["git2"]}

[dev-dependencies]
wasm-bindgen-test = {path="../submodules/wasm-bindgen/crates/test"}

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
